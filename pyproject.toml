[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mvkit"
version = "0.1.0"
description = "McKean-Vlasov particle simulation, fast"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Tristan" }]
keywords = ["mckean-vlasov", "sde", "mean-field", "particle-system", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/yourusername/mvkit"

[tool.maturin]
manifest-path = "crates/mvkit-py/Cargo.toml"
python-source = "python"
module-name = "mvkit._core"
features = ["pyo3/extension-module"]
